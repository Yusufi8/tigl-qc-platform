        if (S.users.some(x=>x.username===un)) return toast("Username already taken.", "bad"); if (pw.length<8) return toast("Temporary password too short.", "bad");
        const r=$("#nu-r").value; S.users.push({id:uid("u"), name:nm, username:un, email:$("#nu-e").value.trim(), password:pw, mustChange:true, role:r, designation:$("#nu-d").value.trim()||S.roles[r].name, site:$("#nu-s").value, entity:"TIGL", active:true, failed:0});
        audit("created user", un, `role ${S.roles[r].name}`); save(); closeModal(); renderView(); toast(`Account ${un} created as ${S.roles[r].name}. Hand over the temporary password.`, "ok"); }; break;
    case "brand-reset": S.settings.primary="#1F5C44"; save(); renderShell(); break;
    case "test": { const k=a.dataset.int; const it=S.integrations[k]; it.status="testing"; renderView();
      setTimeout(()=>{ it.status="connected"; if (k==="odoo") it.lastSync=Date.now(); audit("tested integration", k, "OK");
        save(); renderView(); toast(k==="smtp" ? `Test email queued to ${$("#smtp-to")?.value||me().email}.` : k==="odoo" ? `Connected to Odoo ${it.version} · ${it.db} · uid 42` : "Google Workspace reachable · domain verified", "ok"); }, 900); break; }
    case "api-try": { const ep = API[+a.dataset.i]; const ins = S.inspections[S.inspections.length-1]; const r = resultOf(ins);
      const out = ep[1].includes(".pdf") ? {status:423, error:"REPORT_LOCKED", message:"Required signatures missing: approved", missing:["approved"]} :
        ep[1]==="/api/v1/health" ? {status:"ok", version:"0.9.0", db:"ok", queue:"ok", odoo:"ok"} :
        ep[1].startsWith("/api/v1/templates") ? {data:S.templates.filter(t=>t.status==="published").map(t=>({code:t.code, revision:t.revision, parameters:allParams(t).length}))} :
        {data:{id:"SBX-"+ins.id.slice(-4), template:{code:ins.templateCode, revision:ins.templateRev}, status:ins.status, result:r.result, counts:{recorded:r.done, total:r.total, failed:r.fail},
          header:{customer:"Sandbox Customer", work_order:"WH/MO/00000", serial:"SBX-0001"}, company_id:ins.entity, odoo:{mrp_production_id:ins.odoo?.mo_id||null}, _links:{self:`/api/v1/inspections/SBX-${ins.id.slice(-4)}`}}};
      $("#api-out").textContent = `${ep[0]} ${ep[1]}\nAuthorization: Bearer tqc_sbx_••••\n\n` + JSON.stringify(out, null, 2); break; }
    case "key-new": { const k = "tqc_sbx_" + Math.random().toString(36).slice(2,6) + Math.random().toString(36).slice(2,22);
      S.apiKeys.push({id:uid("k"), name:"Sandbox key "+(S.apiKeys.length+1), prefix:k.slice(0,12), scopes:["inspections:read"], created:Date.now(), lastUsed:null}); audit("created API key", k.slice(0,12)); save();
      modal(`<header><h3>Copy your key now</h3><button class="x" data-act="close">×</button></header><div class="bd"><p>This is the only time the full key is shown.</p><pre class="code">${k}</pre></div><footer><button class="btn pri" data-act="close">Done</button></footer>`); renderView(); break; }
    case "key-revoke": S.apiKeys = S.apiKeys.filter(k=>k.id!==a.dataset.id); audit("revoked API key", a.dataset.id); save(); renderView(); break;
    case "hook-test": toast("Test event delivered: 200 OK in 182 ms.", "ok"); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act==="switch-user"){ S.currentUser = t.value; save(); location.hash = "#/dashboard"; renderShell(); toast(`Now viewing as ${me().name} (${S.roles[me().role].name}).`); return; }
  if (t.dataset.act==="inv"){ setValue(route.arg, t.dataset.p, t.value); refreshRow(route.arg, t.dataset.p); return; }
  if (t.dataset.act==="ni-tpl"){ const tp=latestTpl(t.value); $("#ni-type").innerHTML=(tp.machine_types||["Standard"]).map(v=>`<option>${esc(v)}</option>`).join(""); return; }
  if (t.dataset.act==="ni-cust"){ const e=custEntity(t.value); if (e) $("#ni-ent").value=e; return; }
  if (t.dataset.act==="cust-ent"){ const c=S.customers[+t.dataset.i]; const old=c.entity; c.entity=t.value; audit("changed issuing entity", c.name, `${old} → ${t.value}`); save(); toast("Saved. Applies to new inspections.", "ok"); return; }
  if (t.dataset.auth){ S.settings.auth[t.dataset.auth]=parseInt(t.value)||0; audit("changed sign-in policy", t.dataset.auth, t.value); save(); return; }
  if (t.dataset.ent){ entityOf(t.dataset.ent).address=t.value; audit("changed letterhead", t.dataset.ent); save(); return; }
  if (t.dataset.act==="filter-status"){ listFilter.status=t.value; renderView(); return; }
  if (t.dataset.act==="user-role"){ const u=userById(t.dataset.id); const old=u.role; u.role=t.value; audit("changed role", u.email, `${S.roles[old].name} → ${S.roles[u.role].name}`); save(); if (u.id===me().id) renderShell(); else toast("Role updated.", "ok"); return; }
  if (t.dataset.act==="perm"){ const r=S.roles[t.dataset.r]; const k=t.dataset.k; r.perms = t.checked ? [...new Set([...r.perms,k])] : r.perms.filter(x=>x!==k); audit("changed permission", r.name, `${k} ${t.checked?"granted":"revoked"}`); save(); return; }
  if (t.dataset.act==="ncr-disp"){ const n=S.ncrs.find(x=>x.id===t.dataset.id); n.disposition=t.value; audit("set NCR disposition", n.id, t.value); save(); return; }
  if (t.dataset.act==="tpl-f"){ const d=S.templates.find(x=>x.status==="draft" && x.code===route.arg); const p=allParams(d).find(x=>x.id===t.dataset.pid); const f=t.dataset.f; p[f] = (f==="min"||f==="max") ? parseFloat(t.value) : t.value; save(); return; }
  if (t.dataset.act==="tpl-b"){ const d=S.templates.find(x=>x.status==="draft" && x.code===route.arg); const p=allParams(d).find(x=>x.id===t.dataset.pid); p[t.dataset.f]=t.checked; save(); return; }
  if (t.dataset.set){ const k=t.dataset.set; S.settings[k] = k==="retentionYears" ? parseInt(t.value)||10 : t.value; audit("changed setting", k, String(t.value).slice(0,40)); save(); renderShell(); return; }
  if (t.dataset.int){ const [g,k]=t.dataset.int.split("."); S.integrations[g][k]=t.value; audit("changed integration", g, k); save(); return; }
  if (t.dataset.k){ const [g,k] = t.dataset.k.split(":");
    if (g==="mod") S.modules[k]=t.checked;
    else if (g==="slot") S.settings.slots[+k].required=t.checked;
    else if (g==="odoo"||g==="gws") S.integrations[g][k]=t.checked;
    else if (g==="smtp") S.integrations.smtp.events[k]=t.checked;
    else if (g==="flag") S.flags[k]=t.checked;
    else if (g==="auth") S.settings.auth[k]=t.checked;
    else if (t.dataset.k==="reauth") S.settings.reauth=t.checked;
    audit("changed setting", t.dataset.k, t.checked?"on":"off"); save(); if (g==="mod") renderShell(); }
});
document.addEventListener("input", e => {
  const t=e.target;
  if (t.dataset.act==="filter-q"){ listFilter.q=t.value; const pos=t.selectionStart; renderView(); const n=$('[data-act="filter-q"]'); n.focus(); n.setSelectionRange(pos,pos); }
  if (t.dataset.act==="inv" && t.tagName==="INPUT"){ setValue(route.arg, t.dataset.p, t.value); clearTimeout(t._tm); t._tm=setTimeout(()=>refreshRow(route.arg, t.dataset.p), 250); }
});
document.addEventListener("keydown", e => { if (e.key==="Escape") closeModal(); if (e.key==="Enter" && (e.target.id==="li-p"||e.target.id==="li-u")) doLogin(); });
window.addEventListener("hashchange", () => { parseHash(); tplEdit = route.path==="template" ? tplEdit : null; $("#app").classList.remove("open"); renderShell(); });
window.addEventListener("beforeprint", () => { const i = route.path==="report" && curIns(); document.body.classList.toggle("unsigned", !(i && sigsComplete(i))); });

/* ---------- boot ---------- */
load(); parseHash(); renderShell();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIGL Quality — qc.tiglobal.com</title>
<style>
:root:not([data-theme="dark"]){
  --brand:#1F5C44; --brand-deep:#123828; --brand-tint:#E6F0EB;
  --ink:#17201C; --ink-2:#46524D; --ink-3:#7A8580;
  --paper:#F3F5F3; --surface:#FFFFFF; --surface-2:#F8FAF8; --line:#D9DED9; --line-2:#E8ECE8;
  --pass:#237A48; --pass-bg:#E3F3E9; --fail:#B42318; --fail-bg:#FBE7E5; --hold:#A8640A; --hold-bg:#FBF0DD;
  --inc:#5D6670; --inc-bg:#ECEEF0; --info:#2457A6; --info-bg:#E6EEFA;
  --radius:6px; --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --brand-tint:#18332A; --ink:#E8EDEA; --ink-2:#B9C3BE; --ink-3:#8A958F;
  --paper:#0F1513; --surface:#161E1B; --surface-2:#1B2521; --line:#2C3833; --line-2:#24302B;
  --pass-bg:#16301F; --fail-bg:#3A1714; --hold-bg:#3A2A10; --inc-bg:#242A2F; --info-bg:#172440; }}
:root[data-theme="dark"]{ --brand-tint:#18332A; --ink:#E8EDEA; --ink-2:#B9C3BE; --ink-3:#8A958F;
  --paper:#0F1513; --surface:#161E1B; --surface-2:#1B2521; --line:#2C3833; --line-2:#24302B;
  --pass-bg:#16301F; --fail-bg:#3A1714; --hold-bg:#3A2A10; --inc-bg:#242A2F; --info-bg:#172440; }
*,*::before,*::after{box-sizing:inherit}
input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
/* sidebar */
.side{background:var(--brand-deep);color:#DCE9E2;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.mark{width:34px;height:34px;border-radius:6px;background:#fff;color:var(--brand-deep);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.3px}
.brand b{display:block;color:#fff;font-size:15px}
.brand small{color:#9DB8AA;font-size:12px}
.nav{padding:10px 8px 20px;flex:1}
.nav h6{margin:16px 10px 6px;font-size:11.5px;font-weight:600;color:#86A595;letter-spacing:.2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:#DCE9E2;text-decoration:none;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:500}
.nav a .ct{margin-left:auto;background:#E9B44C;color:#2B1D00;border-radius:9px;padding:0 7px;font-size:11.5px;font-weight:600}
.nav svg{width:16px;height:16px;flex:none;opacity:.85}
.side .foot{padding:12px 18px;font-size:11.5px;color:#86A595;border-top:1px solid rgba(255,255,255,.08)}
/* top */
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:10px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .menu{display:none}
.crumb{font-size:13px;color:var(--ink-3)}
.crumb b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 10px;background:var(--surface-2)}
.who select{border:0;background:transparent;font-size:13px;max-width:240px}
.av{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.bell i{position:absolute;top:-3px;right:-3px;background:var(--fail);color:#fff;font-style:normal;font-size:10.5px;border-radius:8px;padding:0 5px}
.content{flex:1;overflow-y:auto;padding:22px 26px 60px}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:22px;margin:0;font-weight:600;letter-spacing:-.2px}
.page-h p{margin:3px 0 0;color:var(--ink-2)}
.page-h .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* primitives */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:7px 13px;cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn svg{width:15px;height:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel>header h3{margin:0;font-size:14.5px;font-weight:600}
.panel>header .sp{flex:1}
.panel .bd{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
.scroll-x{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.PASS,.pass{color:var(--pass);background:var(--pass-bg)}.FAIL,.fail{color:var(--fail);background:var(--fail-bg)}
.HOLD,.hold{color:var(--hold);background:var(--hold-bg)}.INCOMPLETE,.inc{color:var(--inc);background:var(--inc-bg)}
.info{color:var(--info);background:var(--info-bg)}
.muted{color:var(--ink-3)}.small{font-size:12.5px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.inp,.sel,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:8px 10px;width:100%;min-height:36px}
.inp:focus,.sel:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:11px;transition:.15s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--brand)}.switch input:checked+span::after{left:19px}
.switch input:disabled+span{opacity:.55}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:13.5px}
.banner.warn{background:var(--hold-bg);color:var(--hold)}.banner.inf{background:var(--info-bg);color:var(--info)}.banner.bad{background:var(--fail-bg);color:var(--fail)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;max-height:340px;margin:0}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
/* KPI */
.kpi{padding:14px 16px}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
.kpi .l{color:var(--ink-2);font-size:13px;margin-top:4px}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:6px}
.kpi.alert .v{color:var(--hold)}
/* inspection runner */
.ins-head{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px 18px}
.ins-head .meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--ink-2);margin-top:6px}
.ins-head .meta b{color:var(--ink);font-weight:500}
.result-big{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.result-big .pill{font-size:15px;padding:5px 14px}
.stages{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;margin:14px 0}
.stage{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;cursor:pointer;min-width:150px;text-align:left}
.stage.on{border-color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
.stage b{display:block;font-size:13px;font-weight:600}
.stage small{color:var(--ink-3);font-size:12px}
.stage .bar{height:4px;background:var(--line-2);border-radius:2px;margin-top:6px;overflow:hidden;display:flex}
.stage .bar i{display:block;height:100%}
.sec{margin-bottom:16px}
.sec h4{margin:0;font-size:13.5px;font-weight:600;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line-2);border-radius:8px 8px 0 0}
.prow{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(150px,.8fr) minmax(220px,1.2fr) 92px 66px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.prow:last-child{border-bottom:0}
.prow .lab{font-weight:500}
.prow .lab .tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:11px;padding:0 6px;border-radius:3px;background:var(--inc-bg);color:var(--ink-2);font-weight:500}
.tag.crit{background:var(--fail-bg);color:var(--fail)}.tag.ev{background:var(--info-bg);color:var(--info)}.tag.tbc{background:var(--hold-bg);color:var(--hold)}
.prow .spec{font-size:12.5px;color:var(--ink-2)}
.prow .res{justify-self:start}
.prow .tools{display:flex;gap:4px;justify-self:end}
.ico{border:1px solid var(--line);background:var(--surface);border-radius:5px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;position:relative}
.ico svg{width:14px;height:14px}
.ico.has{border-color:var(--info);color:var(--info)}
.ico.need{border-color:var(--hold);color:var(--hold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:500;min-width:64px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.ok{background:var(--pass);color:#fff}.seg button.on.ng{background:var(--fail);color:#fff}
.gauge{position:relative;height:8px;border-radius:4px;background:var(--fail-bg);margin-top:6px}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--pass-bg);border-left:2px solid var(--pass);border-right:2px solid var(--pass)}
.gauge .mk{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.gauge .mk.f{background:var(--fail)}
.prow .extra{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.ev-chip{display:inline-flex;gap:5px;align-items:center;background:var(--info-bg);color:var(--info);border-radius:4px;padding:1px 7px}
.foot-bar{position:sticky;bottom:-60px;margin:18px -26px -60px;padding:12px 26px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* report */
.report-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.sheet{background:#fff;color:#1c1c1c;border:1px solid var(--line);border-radius:4px;padding:36px 40px;max-width:860px;position:relative;overflow:hidden}
.sheet .rh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--brand);padding-bottom:12px;margin-bottom:16px}
.sheet .rh h2{margin:0;font-size:18px;letter-spacing:.2px}
.sheet .rh .co{font-weight:700;color:var(--brand);font-size:15px}
.sheet table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
.sheet th,.sheet td{border:1px solid #cfd4d1;padding:5px 7px;text-align:left;vertical-align:top}
.sheet th{background:#f1f4f2;font-weight:600}
.sheet h5{font-size:12.5px;margin:16px 0 6px;color:var(--brand)}
.sheet .r-pass{color:#237A48;font-weight:600}.sheet .r-fail{color:#B42318;font-weight:600}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wm span{transform:rotate(-28deg);font-size:72px;font-weight:700;color:rgba(180,35,24,.07);letter-spacing:4px;white-space:nowrap}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}
.sig{border:1px dashed #b9c0bc;border-radius:4px;padding:10px 12px;min-height:118px;position:relative}
.sig.done{border-style:solid;border-color:#9fb8ab;background:#fbfdfc}
.sig .mean{font-size:11px;color:#6b746f;font-weight:600}
.sig .ink{font-size:30px;line-height:1.15;color:#123a8c;margin:4px 0 2px;min-height:38px}
.sig .nm{font-size:12px;font-weight:600}.sig .ds{font-size:11.5px;color:#56605b}
.sig .ts{font-size:10px;color:#7b847f;margin-top:4px;word-break:break-all}
.sig .here{position:absolute;inset:auto 10px 10px 10px}
.sign-tag{position:absolute;left:-1px;top:14px;background:#F2C14E;color:#2b1d00;font-size:11px;font-weight:700;padding:2px 8px 2px 6px;border-radius:0 3px 3px 0}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.45);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{width:min(820px,100%)}
.modal>header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.modal>header h3{margin:0;font-size:16px;flex:1}
.modal .bd{padding:18px 20px}
.modal>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line-2);background:var(--surface-2);border-radius:0 0 10px 10px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3)}
.sig-styles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sig-style{border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:#fff;color:#123a8c;font-size:26px;text-align:left;min-height:62px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sig-style.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.sig-preview{border-bottom:1.5px solid #7d8781;background:#fff;color:#123a8c;font-size:40px;padding:6px 10px 2px;min-height:64px;border-radius:6px 6px 0 0}
.toast-host{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px;font-size:13.5px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.ok{background:var(--pass);color:#fff}.toast.bad{background:var(--fail);color:#fff}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 28px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--fail)}
.act{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.act:last-child{border-bottom:0}
.act .when{color:var(--ink-3);font-size:12px;margin-left:auto;white-space:nowrap}
.mtx td,.mtx th{text-align:center}.mtx td:first-child,.mtx th:first-child{text-align:left}
.lock{color:var(--ink-3);font-size:12px}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.notif-pop{position:absolute;right:22px;top:54px;width:340px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:50;max-height:420px;overflow:auto}
.notif-pop .n{padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:13px}
@media (max-width: 1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .report-wrap{grid-template-columns:1fr} .prow{grid-template-columns:1fr 1fr} .prow .lab{grid-column:1/-1} .prow .tools{justify-self:start}}
@media (max-width: 820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .top .menu{display:grid}
  .content{padding:16px 14px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .foot-bar{margin:18px -14px -60px;padding-left:14px;padding-right:14px}
  .crumb{display:none} .who select{max-width:150px} .who .small{display:none}
  .ins-head{grid-template-columns:1fr} .result-big{align-items:flex-start}
  .sheet{padding:20px 16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{
  body *{visibility:hidden}
  #printable,#printable *{visibility:visible}
  #printable{position:absolute;left:0;top:0;width:100%;border:0;padding:0}
  body.unsigned #printable{display:none}
  body.unsigned::after{visibility:visible;content:"This QC report cannot be printed or saved as PDF until all required e-signatures are applied.";position:fixed;top:40px;left:40px;font:16px sans-serif}
  .sign-tag,.here{display:none!important}
}

.login-host{display:block}
.login{min-height:100vh;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--brand-deep,#123828),var(--brand))}
.login-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-card h2{margin:0 0 4px;font-size:20px}
.login-card .brand b{color:var(--ink)} .login-card .brand small{color:var(--ink-3)}
.login-card.demo{max-width:420px}
.login-card .mark{background:var(--brand);color:#fff} .login-card .brand{border:0;display:flex}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-u{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;text-align:left}
.demo-u:hover{border-color:var(--brand)} .demo-u span{font-size:11.5px;color:var(--ink-3)}
.seal{margin-top:12px;padding:8px 10px;border:1px solid #9cc5ae;background:#f1f8f4;color:#1d4d36;border-radius:6px;font-size:11px}

/* TIGL preview refresh: calmer contrast, clearer hierarchy, and room for touch. */
:root:not([data-theme="dark"]){
  --paper:#F4F6F4; --surface:#FFFFFF; --surface-2:#F8FAF8; --line:#DDE4DE; --line-2:#E9EEEA;
  --ink:#18221D; --ink-2:#4C5A52; --ink-3:#738078; --brand:#176B4B; --brand-deep:#123D2F; --brand-tint:#E7F2EC;
  --pass:#197647; --pass-bg:#E7F5EC; --fail:#B42318; --fail-bg:#FDECEA; --hold:#9A5B08; --hold-bg:#FFF3D9;
  --inc:#52616B; --inc-bg:#EDF1F3; --info:#2457A6; --info-bg:#EAF1FC;
  --radius:8px; color-scheme:light;
  font-family:Inter,"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{color-scheme:dark}
body{font-size:14px;line-height:1.5;letter-spacing:.005em}
.app{grid-template-columns:248px minmax(0,1fr)}
.side{box-shadow:1px 0 0 rgba(12,35,24,.08)}
.brand{padding:20px 20px 17px;min-height:76px}
.mark{border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.nav{padding:14px 10px 24px}
.nav h6{margin:20px 12px 8px;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px}
.nav a{min-height:40px;padding:9px 12px;border-radius:7px;transition:background .15s,color .15s}
.nav a.on{background:rgba(255,255,255,.15);box-shadow:inset 3px 0 0 #9CC9B1}
.side .foot{padding:14px 20px;line-height:1.7}
.top{min-height:62px;padding:10px 28px;background:var(--surface);box-shadow:0 1px 2px rgba(17,36,25,.025)}
.top .crumb{min-width:0;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{min-width:0;max-width:min(420px,42vw);border-radius:9px;padding:4px 8px 4px 12px;gap:10px;flex:0 1 auto}
.who .small{flex:none;white-space:nowrap}
.who select{min-width:0;max-width:min(285px,26vw);flex:1 1 auto;font-weight:500}
.bell{border-radius:9px;width:38px;height:38px}
.content{padding:30px clamp(22px,3vw,44px) 64px;scrollbar-gutter:stable}
.page-h{align-items:center;margin-bottom:22px;gap:18px}
.page-h h1{font-size:26px;letter-spacing:-.55px;font-weight:650}
.page-h p{font-size:13.5px;margin-top:5px;color:var(--ink-2)}
.btn{min-height:38px;border-radius:8px;padding:8px 14px;transition:background .15s,border-color .15s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn.pri{box-shadow:0 1px 2px rgba(16,67,45,.15)}
.btn.sm{min-height:32px}
.panel{border-radius:11px;box-shadow:0 1px 2px rgba(19,42,28,.035)}
.panel>header{min-height:50px;padding:13px 18px}
.panel>header h3{font-size:14px;letter-spacing:.005em}
.panel .bd{padding:18px}
.grid{gap:18px}
.kpi{position:relative;overflow:hidden;padding:18px 19px 17px;min-height:126px}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--brand)}
.kpi.alert:before{background:var(--hold)}
.kpi .v{font-size:31px;letter-spacing:-.7px;font-weight:650}
.kpi .l{font-size:13px;font-weight:600;color:var(--ink);margin-top:6px}
.kpi .d{font-size:12px;line-height:1.45;margin-top:5px;color:var(--ink-3)}
.chart svg{max-height:245px}
.hbar{grid-template-columns:minmax(0,1fr) 96px 24px;gap:12px;padding:8px 0}
.hbar .t{font-size:12.5px}
.hbar .b{height:7px;background:#F2E8E6}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.055em;padding:10px 12px}
.tbl td{padding:11px 12px}
.grid.g2>.panel:first-child .tbl th:first-child,.grid.g2>.panel:first-child .tbl td:first-child{width:50%}
.grid.g2>.panel:first-child .tbl th:not(:first-child),.grid.g2>.panel:first-child .tbl td:not(:first-child){white-space:nowrap;text-align:right}
.dash-bottom{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr)}
.dash-bottom .tbl{table-layout:fixed}
.dash-bottom .tbl th{font-size:10.5px;letter-spacing:.03em;padding-left:6px;padding-right:6px}
.dash-bottom .tbl th:first-child,.dash-bottom .tbl td:first-child{width:48%}
.act{gap:11px;padding:10px 0;align-items:flex-start}
.pill{padding:3px 9px;font-size:11.5px}
.ins-head{padding:20px 22px;gap:20px}
.ins-head .meta{gap:9px 24px;line-height:1.55}
.result-big .pill{font-size:13px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;overflow:visible;margin:16px 0}
.stage{min-width:0;min-height:68px;border-radius:9px;padding:10px 12px;transition:border-color .15s,background .15s}
.stage:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--brand-tint)}
.stage.on{background:var(--brand-tint);box-shadow:inset 0 -3px 0 var(--brand)}
.stage small{display:block;margin-top:3px}
.sec{border-radius:10px;overflow:hidden;margin-bottom:14px}
.sec h4{padding:12px 17px;border-radius:0;font-size:13px}
.prow{min-height:68px;padding:12px 17px;gap:14px}
.prow .lab{font-size:13px;line-height:1.4}
.prow .spec{font-size:12px}
.inp,.sel,textarea.inp{min-height:40px;border-radius:8px}
.seg button{min-height:42px}
.foot-bar{bottom:-64px;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(22,42,30,.05)}
.modal{border-radius:13px}
.modal>header,.modal .bd{padding-left:22px;padding-right:22px}
.toast{border-radius:9px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--info) 76%,white);outline-offset:2px}
@media (max-width:1100px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .content{padding-left:22px;padding-right:22px}
  .stages{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
  .top .crumb{display:none}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .content{padding:20px 16px 64px}
  .top{min-height:58px;padding:9px 14px;gap:8px}
  .who{margin-left:auto}
  .page-h{align-items:flex-start;margin-bottom:18px}
  .page-h h1{font-size:23px}
  .page-h .acts{margin-left:0;width:100%}
  .page-h .acts .btn{flex:1;justify-content:center}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .stage{min-height:64px}
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 14px}
  .prow .lab{grid-column:1/-1}
  .prow .spec{grid-column:1}
  .prow .res{grid-column:2;grid-row:2}
  .prow .tools{grid-column:2;justify-self:end}
  .prow .extra{grid-column:1/-1}
  .foot-bar{margin:18px -16px -64px;padding-left:16px;padding-right:16px}
}
@media (max-width:480px){
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px;min-height:112px}
  .kpi .v{font-size:27px}
  .kpi .l{font-size:12px}
  .kpi .d{font-size:11px}
  .stages{grid-template-columns:1fr 1fr}
  .stage{padding:9px 10px}
  .stage b{font-size:12px}
  .ins-head{padding:16px}
  .ins-head .meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
  .top .btn[data-act="logout"]{font-size:0;padding:0;width:36px}
  .top .btn[data-act="logout"]:after{content:"↗";font-size:16px}
}
@media (prefers-reduced-motion:reduce){.nav a,.btn,.stage{transition:none}}
</style>
</head>

/* ---------- Validation engine (deterministic; mirrors server rules) ---------- */
const Engine = {
  spec(p){
    switch(p.type){
      case "qty": return `Qty ${p.expected} ${p.unit||""}`;
      case "range": return (p.min<=0 && p.min>=0 ? `≤ ${p.max}` : `${p.min} – ${p.max}`) + ` ${p.unit||""}`;
      case "exact": return `= ${p.expected} ${p.unit||""}`;
      case "yes_no": return `Expected: ${p.expected}`;
      case "pass_fail": return p.criteria || "Pass / Fail";
      case "select": return p.accept.length===p.options.length ? "Record make" : "Accept: "+p.accept.join(", ");
      case "text": return p.hint || "Record value";
    } return "";
  },
  evalParam(p, e){
    const v = e?.v;
    if (v===undefined || v===null || v==="") return p.mandatory ? "missing" : "na";
    let r;
    switch(p.type){
      case "qty": r = Number(v)===Number(p.expected) ? "pass" : "fail"; break;
      case "range": { const n = parseFloat(v); if (isNaN(n)) return "invalid"; r = (n>=p.min && n<=p.max) ? "pass" : "fail"; break; }
      case "exact": r = String(v).trim().toLowerCase()===String(p.expected).trim().toLowerCase() ? "pass" : "fail"; break;
      case "yes_no": r = v===p.expected ? "pass" : "fail"; break;
      case "pass_fail": r = v==="Pass" ? "pass" : "fail"; break;
      case "select": r = p.accept.includes(v) ? "pass" : "fail"; break;
      default: r = "recorded";
    }
    if (p.evidence && !(e?.ev?.length)) return r==="fail" ? "fail" : "evidence";
    return r;
  },
  /* Precedence: FAIL (critical) > INCOMPLETE > HOLD (non-critical fail) > PASS */
  summarize(tpl, values){
    const s = {total:0, done:0, pass:0, fail:0, critFail:0, missing:0, evidence:0, failed:[], byStage:{}};
    for (const st of tpl.stages){
      const b = s.byStage[st.code] = {total:0, done:0, fail:0, missing:0};
      for (const sec of st.sections) for (const p of sec.params){
        const r = this.evalParam(p, values[p.id]);
        if (r==="na") continue;
        s.total++; b.total++;
        if (r==="missing"||r==="invalid"){ s.missing++; b.missing++; continue; }
        s.done++; b.done++;
        if (r==="evidence"){ s.evidence++; b.missing++; }
        if (r==="pass"||r==="recorded") s.pass++;
        if (r==="fail"){ s.fail++; b.fail++; s.failed.push(p); if (p.critical) s.critFail++; }
      }
    }
    s.result = s.critFail ? "FAIL" : (s.missing||s.evidence) ? "INCOMPLETE" : s.fail ? "HOLD" : "PASS";
    return s;
  }
};

function genValue(p, fail){
  switch(p.type){
    case "qty": return fail ? p.expected - 1 : p.expected;
    case "range": { const span = p.max - p.min, dp = span < 1 ? 3 : 1;
      if (fail) return +(p.max + span*(0.15 + rnd()*0.4)).toFixed(dp);
      return +(p.min + span*(0.15 + rnd()*0.6)).toFixed(dp); }
    case "exact": return p.expected;
    case "yes_no": return fail ? "No" : "Yes";
    case "pass_fail": return fail ? "Fail" : "Pass";
    case "select": return pick(p.accept);
    case "text": return /serial|sl|no\./i.test(p.label) ? "SN" + Math.floor(100000 + rnd()*899999) : pick(["Class F","Rev 3","L&T","04/2026","415 V","3.4"]);
  } return "";
}
function allParams(tpl){ return tpl.stages.flatMap(st => st.sections.flatMap(s => s.params)); }
/* Effective checklist for one machine: template rev, filtered by variant, plus order-specific checks */
function variantOf(ins){ return ins.header?.["Machine type"] || ""; }
function applies(p, v){ return !p.applies || !p.applies.length || p.applies.includes(v); }
function effTpl(ins){
  const t = tplOf(ins.templateCode, ins.templateRev); const v = variantOf(ins);
  const stages = t.stages.map(st => ({...st, sections: st.sections.map(sec => ({...sec, params: sec.params.filter(p => applies(p, v))})).filter(sec => sec.params.length)})).filter(st => st.sections.length);
  if (ins.extra?.length) stages.push({code:"ORD", name:"Order-specific checks", sections:[{name:"Added for this order by Engineering / Quality", params:ins.extra}]});
  return {...t, stages};
}

/* ---------- Workflow transitions (each signature-bearing step goes through e-sign) ---------- */
function transition(ins, act){
  const t = effTpl(ins); const s = Engine.summarize(t, ins.values);
  if (act==="submit"){
    if (s.result==="INCOMPLETE") return toast("Record all mandatory values and evidence first.", "bad");
    openSign(ins, "checked", () => {
      ins.status = "submitted"; ins.log.push({at:Date.now(), by:me().id, what:"Submitted and signed (Checked by)"});
      if (s.result==="FAIL"){ const n = {id:`NCR-2026-${String(S.ncrs.length+31).padStart(4,"0")}`, inspection:ins.id, param:s.failed.find(p=>p.critical)?.label, paramId:s.failed.find(p=>p.critical)?.id, raisedAt:Date.now(), owner:"u6", disposition:"", status:"open", note:""};
        S.ncrs.push(n); ins.status="rejected"; audit("raised NCR", n.id, `from ${ins.id}`); notify(`${n.id} raised: ${n.param} out of tolerance on ${ins.id}`, ["qm","supervisor","production"]); toast(`${n.id} raised automatically.`, "bad"); }
      else notify(`${ins.id} submitted — ready for review`, ["supervisor"]);
      audit("submitted inspection", ins.id, s.result); save(); renderShell();
    });
  }
  if (act==="review") openSign(ins, "reviewed", () => { ins.status="reviewed"; ins.log.push({at:Date.now(), by:me().id, what:"Reviewed and signed"}); audit("reviewed inspection", ins.id); notify(`${ins.id} reviewed — awaiting approval`, ["qm"]); save(); renderShell(); });
  if (act==="approve"){
    const go2 = () => openSign(ins, "approved", () => { ins.status="approved"; ins.log.push({at:Date.now(), by:me().id, what:"Approved and signed"}); audit("approved inspection", ins.id, s.result);
      if (S.integrations.odoo.enabled && ins.odoo){ ins.odoo.synced = true; audit("pushed result to Odoo", ins.id, `mrp.production #${ins.odoo.mo_id}`); }
      notify(`${ins.id} approved — report ready`, ["inspector","supervisor","production","management"]); save(); renderShell(); toast("Approved. Report unlocked for download.", "ok"); });
    if (s.result==="HOLD"){
      modal(`<header><h3>Concession for ${ins.id}</h3><button class="x" data-act="close">×</button></header><div class="bd">
        <div class="banner warn">Non-critical deviations: ${s.failed.map(p=>esc(p.label)).join(", ")}</div>
        <div class="field"><label>Concession justification (appears on the report)</label><textarea class="inp" id="conc" rows="3" placeholder="Why is this acceptable for despatch?"></textarea></div></div>
        <footer><button class="btn" data-act="close">Cancel</button><button class="btn pri" id="conc-ok">Continue to sign</button></footer>`);
      $("#conc-ok").onclick = () => { const v=$("#conc").value.trim(); if (v.length<10) return toast("Write a justification of at least 10 characters.", "bad"); ins.concession = {by:me().id, note:v, at:Date.now()}; go2(); };
    } else go2();
  }
  if (act==="return"){ ins.status="draft"; delete ins.signatures.checked; ins.log.push({at:Date.now(), by:me().id, what:"Returned to inspector"}); audit("returned inspection", ins.id); save(); renderShell(); toast(`${ins.id} returned to the inspector.`); }
  if (act==="reject"){ ins.status="rejected"; ins.log.push({at:Date.now(), by:me().id, what:"Rejected"}); audit("rejected inspection", ins.id); save(); renderShell(); }
}

/* ===================== E-signature service ===================== */
const SIG_FONTS = ["Dancing Script","Great Vibes","Caveat","Homemade Apple"];
async function docHash(ins){
  const canon = JSON.stringify({id:ins.id, entity:ins.entity, tpl:ins.templateCode+"@"+ins.templateRev, header:ins.header, extra:(ins.extra||[]).map(p=>[p.id,p.label,p.type,p.min,p.max,p.expected]), values:Object.keys(ins.values).sort().map(k=>[k, ins.values[k].v, (ins.values[k].ev||[]).map(f=>f.name)]), concession:ins.concession?.note||null});
  try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(canon)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; for (const c of canon) h=(h*31+c.charCodeAt(0))|0; return ("00000000"+(h>>>0).toString(16)).slice(-8).repeat(8); }
}
function eligibleSlot(ins, slot){

  if (Object.values(ins.signatures).some(sg=>sg.userId===u.id)) return false; // one person, one signature per record
  return true;
}

    ${S.settings.reauth?`<div class="field"><label for="sg-pin">Confirm it's you — re-enter your password (${esc(u.username)})</label><input class="inp" id="sg-pin" type="password" autocomplete="current-password" style="max-width:260px"></div>`:""}

/* ---------- Order-specific checks (machine built differently from the standard template) ---------- */
function addCheckModal(ins){
  const t = tplOf(ins.templateCode, ins.templateRev);
  modal(`<header><h3>Add order-specific check — ${ins.id}</h3><button class="x" data-act="close">×</button></header><div class="bd">
    <div class="banner inf">Applies to this machine only. For changes that should apply to every future machine, start a new template revision instead.</div>
    <div class="field"><label>Check / parameter</label><input class="inp" id="oc-l" placeholder="e.g. Extended discharge chute — length"></div>
    <div class="grid g2" style="gap:0 12px">
      <div class="field"><label>Type</label><select class="sel" id="oc-t"><option value="range">Measured value (min–max)</option><option value="pass_fail">Pass / Fail</option><option value="yes_no">Yes / No</option><option value="qty">Quantity</option><option value="text">Record only</option></select></div>
      <div class="field"><label>Unit</label><input class="inp" id="oc-u" placeholder="mm"></div>
      <div class="field"><label>Min / expected qty</label><input class="inp" id="oc-min" inputmode="decimal"></div>
      <div class="field"><label>Max</label><input class="inp" id="oc-max" inputmode="decimal"></div></div>
    <div class="row" style="gap:18px;margin-bottom:10px"><label class="chk small"><input type="checkbox" id="oc-c"> Critical</label><label class="chk small"><input type="checkbox" id="oc-e"> Photo evidence required</label></div>
    <div class="field"><label>Reason / customer requirement (printed on report)</label><input class="inp" id="oc-r" placeholder="SO S00561 — customer asked for 300 mm extension"></div>
  </div><footer><button class="btn" data-act="close">Cancel</button><button class="btn pri" id="oc-ok">Add check</button></footer>`);
  $("#oc-ok").onclick = () => {
    const ty=$("#oc-t").value, l=$("#oc-l").value.trim(), r=$("#oc-r").value.trim(), mn=parseFloat($("#oc-min").value), mx=parseFloat($("#oc-max").value);
    if (l.length<4 || r.length<5) return toast("Enter the check and the reason.", "bad");
    if (ty==="range" && (isNaN(mn)||isNaN(mx)||mn>mx)) return toast("Enter a valid min and max.", "bad");
    if (ty==="qty" && isNaN(mn)) return toast("Enter the expected quantity in Min.", "bad");
    ins.extra = ins.extra || [];
    const p = {id:"ORD-"+String(ins.extra.length+1).padStart(2,"0"), label:l, type:ty, unit:$("#oc-u").value.trim(), mandatory:true, critical:$("#oc-c").checked, evidence:$("#oc-e").checked, reason:r, addedBy:me().name, addedAt:Date.now()};
    if (ty==="range"){ p.min=mn; p.max=mx; } if (ty==="qty") p.expected=mn; if (ty==="yes_no") p.expected="Yes";
    ins.extra.push(p); ins.log.push({at:Date.now(), by:me().id, what:`Added order-specific check ${p.id}: ${l}`});
    audit("added order-specific check", ins.id, `${p.id} ${l} — ${r}`); notify(`${ins.id}: order-specific check ${p.id} added by ${me().name}`, ["inspector","supervisor","qm"]);
    save(); closeModal(); curStage[ins.id]="ORD"; renderView(); toast(`${p.id} added to ${ins.id}.`, "ok");
  };
}
/* ===================== Reports + e-signed PDF ===================== */
registerModule({id:"reports", label:"QC reports", icon:"rep", group:"Work", perm:"report.view", module:"reports", match:["report"],
  crumb(arg){ return arg ? "QC reports / "+arg : "QC reports"; },
  render(arg){
    if (route.path==="report" && arg) return renderReport(arg);
    const rows = visibleInspections().filter(i=>i.status!=="draft").sort((a,b)=>b.createdAt-a.createdAt);
    return `<div class="page-h"><div><h1>QC reports</h1><p>PDFs can only be downloaded once every required signature is applied.</p></div></div>
    <div class="panel"><div class="scroll-x"><table class="tbl"><thead><tr><th>Report</th><th>Customer</th><th>Issued by</th><th>Serial no.</th><th>Result</th><th>Signatures</th><th>PDF</th></tr></thead><tbody>
    ${rows.map(i=>{ const s=resultOf(i); const req=S.settings.slots.filter(x=>x.required); const got=req.filter(x=>i.signatures[x.key]).length;
      return `<tr class="click" data-go="report/${i.id}"><td><b>${i.id}</b></td><td>${esc(i.header["Customer"])}</td><td><code>${i.entity}</code></td><td>${esc(i.header["Machine serial no."])}</td><td>${pill(s.result)}</td><td>${got}/${req.length}</td><td>${got===req.length?`<span class="pill pass">Unlocked</span>`:`<span class="pill inc">Locked</span>`}</td></tr>`; }).join("")}
    </tbody></table></div></div>`;
  },
  after(arg){ if (route.path==="report" && arg){ const ins=S.inspections.find(i=>i.id===arg); if (ins) document.body.classList.toggle("unsigned", !sigsComplete(ins)); } }
});
function renderReport(id){
  const ins = S.inspections.find(i=>i.id===id); if (!ins || !can("data.prod")) return `<div class="panel"><div class="empty">Report not found.</div></div>`;
  const t = effTpl(ins); const s = Engine.summarize(t, ins.values); const done = sigsComplete(ins);
  const ent = S.entities.find(e=>e.id===ins.entity);
  const slots = S.settings.slots.filter(x=>x.required || ins.signatures[x.key]);
  const stageTables = t.stages.map(st => `<h5>${esc(st.name)}</h5><table><thead><tr><th style="width:9%">Ref</th><th>Parameter</th><th style="width:22%">Specification</th><th style="width:16%">Observed</th><th style="width:9%">Result</th></tr></thead><tbody>
    ${st.sections.map(sec=>`<tr><th colspan="5" style="background:#fafbfa">${esc(sec.name)}</th></tr>`+sec.params.map(p=>{ const e=ins.values[p.id]; const r=Engine.evalParam(p,e); if (r==="na") return "";
      return `<tr><td>${p.id}</td><td>${esc(p.label)}${p.reason?`<br><i style="color:#666">Order-specific: ${esc(p.reason)}</i>`:""}${e?.remark?`<br><i style="color:#666">${esc(e.remark)}</i>`:""}</td><td>${esc(Engine.spec(p))}</td><td>${esc(e?.v??"—")} ${p.type==="range"&&e?.v!==undefined?esc(p.unit):""}${e?.ev?.length?` 📎`:""}</td><td class="${r==="fail"?"r-fail":r==="pass"?"r-pass":""}">${{pass:"OK",fail:"NOT OK",recorded:"Rec.",missing:"—",evidence:"Ev.",invalid:"Inv."}[r]}</td></tr>`; }).join("")).join("")}
    </tbody></table>`).join("");
  const sigBlock = slots.map(sl => { const g = ins.signatures[sl.key];
    if (g) return `<div class="sig done"><div class="mean">${esc(sl.label)}</div><div class="ink" style="font-family:'${g.style}',cursive">${esc(g.mode==="initials"?g.initials:g.name)}</div>
      <div class="nm">${esc(g.name)}</div><div class="ds">${esc(g.designation)}</div><div class="ts">${fmtDT(g.at)} · ${g.sigId}<br>user ${esc(g.username||g.email||"")} · doc SHA-256 ${g.hash.slice(0,16)}…</div></div>`;
    const el = eligibleSlot(ins, sl.key) && ((sl.key==="checked" && ins.status!=="draft") || (sl.key==="reviewed" && ins.status==="submitted") || (sl.key==="approved" && ins.status==="reviewed"));
    return `<div class="sig">${el?`<span class="sign-tag">Sign here</span>`:""}<div class="mean">${esc(sl.label)}</div><div class="ink"></div><div class="ds">${esc(S.roles[sl.role].name)} — not yet signed</div>
      ${el?`<button class="btn pri sm here" data-act="sign-slot" data-slot="${sl.key}">${I.pen} E-sign</button>`:""}</div>`; }).join("");
  const audits = ins.log.map(l=>`<tr><td>${fmtDT(l.at)}</td><td>${esc(userById(l.by)?.name||l.by)}</td><td>${esc(l.what)}</td></tr>`).join("");
  return `
  <div class="page-h"><div><h1>QC report ${ins.id}</h1><p>${done?"All required signatures applied — download is unlocked.":"Download stays locked until every required signature is applied."}</p></div>
    <div class="acts"><a class="btn" href="#/inspection/${ins.id}">Open inspection</a>
    <button class="btn pri" data-act="pdf" ${done?"":"disabled"} title="${done?"Download signed PDF":"Sign all required fields to download"}">${done?I.dl:I.lock} ${done?"Download PDF":"PDF locked"}</button></div></div>
  <div class="report-wrap">
    <div class="sheet" id="printable">
      ${done?"":`<div class="wm"><span>UNSIGNED DRAFT</span></div>`}
      <div class="rh"><div><div class="co">${esc(ent?.name||S.settings.reportEntity)}</div><div style="font-size:11.5px;color:#555">${esc(ent?.address||S.settings.reportAddress)}</div></div>
        <div style="text-align:right"><h2>Machine inspection report</h2><div style="font-size:12px">${ins.id} · ${fmtD(ins.createdAt)}</div><div style="font-size:12px">Template ${ins.templateCode} rev ${ins.templateRev}</div></div></div>
      <table><tbody>
        <tr><th>Customer</th><td>${esc(ins.header["Customer"])}</td><th>Machine</th><td>${esc(t.name)}</td></tr>
        <tr><th>Sales order</th><td>${esc(ins.header["Sales order"])}</td><th>Machine serial no.</th><td>${esc(ins.header["Machine serial no."])}</td></tr>
        <tr><th>Work order</th><td>${esc(ins.header["Work order"])}</td><th>Machine variant</th><td>${esc(ins.header["Machine type"])}${ins.extra?.length?` + ${ins.extra.length} order-specific check(s)`:""}</td></tr>
        <tr><th>Despatch date</th><td>${esc(ins.header["Despatch date"])}</td><th>Overall result</th><td class="${s.result==="PASS"?"r-pass":"r-fail"}">${s.result}${ins.concession?" — under concession":""}</td></tr>
      </tbody></table>
      ${ins.concession?`<table><tbody><tr><th style="width:22%">Concession</th><td>${esc(ins.concession.note)} — ${esc(userById(ins.concession.by)?.name)}, ${fmtD(ins.concession.at)}</td></tr></tbody></table>`:""}
      <div style="font-size:12px;margin-bottom:6px">${s.done} parameters recorded · ${s.pass} OK · ${s.fail} not OK · ${Object.values(ins.values).filter(v=>v.ev?.length).length} evidence files on record</div>
      ${stageTables}
      <h5>Signatures</h5>
      <div class="sigs">${sigBlock}</div>
      ${done?`<div class="seal">🔏 Digitally sealed by <b>${esc(ent?.name)}</b> · ${esc(ent?.cert.cn)} · cert fingerprint ${esc(ent?.cert.fp)} · ${esc(ent?.cert.algo)} · PAdES, applied by TIGL Quality signing service (self-hosted). Any change to this PDF breaks the seal.</div>`:""}
      <p style="font-size:10.5px;color:#666;margin-top:18px;border-top:1px solid #ddd;padding-top:8px">${esc(S.settings.reportFooter)} Electronic signatures are bound to the SHA-256 hash of the recorded data; any change after signing invalidates them.</p>
    </div>
    <div class="grid" style="gap:16px">
      <div class="panel"><header><h3>Signature status</h3></header><div class="bd">
        ${S.settings.slots.map(sl=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-2)"><span>${esc(sl.label)}${sl.required?"":` <span class="muted small">(optional)</span>`}</span>${ins.signatures[sl.key]?`<span class="pill pass">Signed</span>`:`<span class="pill inc">Pending</span>`}</div>`).join("")}
        <div class="small muted" style="margin-top:10px">Policy: PDF export requires all required signatures. ${S.settings.pdfLock?"Locked by policy.":""}</div></div></div>
      <div class="panel"><header><h3>Record history</h3></header><div class="scroll-x"><table class="tbl"><tbody>${audits}</tbody></table></div></div>
      ${ins.odoo?`<div class="panel"><header><h3>Odoo</h3></header><div class="bd"><dl class="kv"><dt>Sales order</dt><dd>sale.order #${ins.odoo.so_id}</dd><dt>Manufacturing</dt><dd>mrp.production #${ins.odoo.mo_id}</dd><dt>Lot / serial</dt><dd>stock.lot #${ins.odoo.lot_id}</dd><dt>Result pushed</dt><dd>${ins.odoo.synced?"Yes — PDF attached to MO":"After approval"}</dd></dl></div></div>`:""}
    </div>
  </div>`;
}

/* ===================== NCR ===================== */

  count(){ return S.ncrs.filter(n=>n.status==="open").length; },
  render(){
    const ed = can("ncr.manage");
    return `<div class="page-h"><div><h1>Non-conformance reports</h1><p>Raised automatically when a critical parameter fails. Disposition and closure are tracked here.</p></div></div>
    <div class="panel"><div class="scroll-x"><table class="tbl"><thead><tr><th>NCR</th><th>Inspection</th><th>Failed parameter</th><th>Raised</th><th>Disposition</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.ncrs.slice().reverse().map(n=>`<tr><td><b>${n.id}</b></td><td><a href="#/inspection/${n.inspection}">${n.inspection}</a></td><td>${esc(n.param)}</td><td>${fmtD(n.raisedAt)}</td>
      <td>${ed && n.status==="open" ? `<select class="sel" data-act="ncr-disp" data-id="${n.id}" style="min-width:150px"><option value="">Choose…</option>${["Rework","Repair","Use as-is (concession)","Scrap","Return to supplier"].map(o=>`<option ${n.disposition===o?"selected":""}>${o}</option>`).join("")}</select>` : esc(n.disposition||"—")}</td>
      <td>${n.status==="open"?`<span class="pill fail">Open</span>`:`<span class="pill pass">Closed</span>`}</td>
      <td>${ed && n.status==="open" ? `<button class="btn sm" data-act="ncr-close" data-id="${n.id}">Close</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">No NCRs.</td></tr>`}
    </tbody></table></div></div>`;
  }
});

/* ===================== Templates (revision-controlled) ===================== */
let tplEdit = null;
registerModule({id:"templates", label:"Machine templates", icon:"tmpl", group:"Configure", perm:"tmpl.view", module:"templates", match:["template"],
  crumb(arg){ return arg ? "Machine templates / "+arg : "Machine templates"; },
  render(arg){
    if (route.path==="template" && arg) return renderTemplate(arg);
    const codes = [...new Set(S.templates.map(t=>t.code))];
    return `<div class="page-h"><div><h1>Machine templates</h1><p>Adding a machine means adding a template — not writing code. Every change creates a new revision; past inspections keep theirs.</p></div>
      ${can("tmpl.edit")?`<div class="acts"><button class="btn pri" data-act="machine-new">${I.plus} Add machine</button></div>`:""}</div>
    <div class="banner inf" style="margin-bottom:14px"><div><b>Machines differ?</b> Three levels, no code: <b>1. New machine</b> → add a template (blank, copy of a similar machine, or Excel import). <b>2. Variants</b> of one machine (Automatic / Manual / Extended…) → mark checks “applies to” a variant; the inspector picks the variant. <b>3. One-off build</b> for a customer → Engineering/QM add order-specific checks on that inspection.</div></div>
    <div class="panel"><div class="scroll-x"><table class="tbl"><thead><tr><th>Code</th><th>Template</th><th>Current rev</th><th>Parameters</th><th>Critical</th><th>Specs to confirm</th><th>Revisions</th><th>Draft</th></tr></thead><tbody>
    ${codes.map(c=>{ const cur = latestTpl(c) || S.templates.find(t=>t.code===c); const ps = allParams(cur); const revs = S.templates.filter(t=>t.code===c); const dr = revs.find(t=>t.status==="draft"||t.status==="in_review");
      return `<tr class="click" data-go="template/${c}"><td><b>${c}</b></td><td>${esc(cur.name)}</td><td>${latestTpl(c)?cur.revision:`<span class="muted">not yet published</span>`}</td><td>${ps.length}</td><td>${ps.filter(p=>p.critical).length}</td><td>${ps.filter(p=>p.tbc).length?`<span class="pill hold">${ps.filter(p=>p.tbc).length}</span>`:"—"}</td><td>${revs.map(r=>r.revision).sort().join(", ")}</td><td>${dr?`<span class="pill info">Rev ${dr.revision} ${dr.status==="in_review"?"in review":"draft"}</span>`:"—"}</td></tr>`; }).join("")}
    </tbody></table></div></div>
    <div class="page-h" style="margin-top:24px"><div><h2 style="margin:0">Product family catalogue</h2><p>Roadmap for digitising every TIGL product line. Stage blueprints are structure only — specs come from Engineering checklists and are published by Quality.</p></div></div>
    <div class="panel"><div class="scroll-x"><table class="tbl"><thead><tr><th>Family</th><th>Category</th><th>Inspection types</th><th>Stage blueprint</th><th>Status</th></tr></thead><tbody>
    ${(SEED.families?.families||[]).map(f=>`<tr><td><b>${esc(f.name)}</b><div class="muted small">${f.code}</div></td><td>${esc(f.category)}</td><td>${f.inspection_types.map(t=>`<span class="pill">${t}</span>`).join(" ")}</td><td class="small">${f.stages.join(" · ")}</td><td>${f.status==="digitised"?`<span class="pill pass">Digitised</span>`:`<span class="pill hold">Awaiting checklist</span>`}</td></tr>`).join("")}
    </tbody></table></div><div class="muted small" style="padding:10px 14px">IPQC in-process · FQC final pre-despatch · FAT factory acceptance (trial run) · SAT site acceptance / commissioning (turnkey)</div></div>
    <div class="banner inf" style="margin-top:16px">Source: the AXIS paper checklist (Axis_Final.xls) was digitised into ${allParams(latestTpl("AXIS-MM")).length} controlled parameters. Items marked “Spec TBC” had ambiguous tolerances in the source sheet and need Engineering sign-off.</div>`;
  }
});
function renderTemplate(code){
  const revs = S.templates.filter(t=>t.code===code).sort((a,b)=>a.revision<b.revision?1:-1);
  const draft = revs.find(t=>t.status==="draft"||t.status==="in_review"); const cur = latestTpl(code);
  const show = (tplEdit && tplEdit.code===code ? revs.find(t=>t.revision===tplEdit.rev) : null) || draft || cur;
  const editable = show.status==="draft" && can("tmpl.edit");
  const acts = [];
  if (!draft && cur && can("tmpl.edit")) acts.push(`<button class="btn pri" data-act="tpl-draft" data-code="${code}">${I.plus} Start revision ${String.fromCharCode(cur.revision.charCodeAt(0)+1)}</button>`);
  if (draft?.status==="draft" && can("tmpl.edit")) acts.push(`<button class="btn" data-act="tpl-discard" data-code="${code}">Discard draft</button><button class="btn pri" data-act="tpl-submit" data-code="${code}">Send for Quality approval</button>`);
  if (draft?.status==="in_review" && can("tmpl.publish")) acts.push(`<button class="btn" data-act="tpl-back" data-code="${code}">Return to Engineering</button><button class="btn pri" data-act="tpl-publish" data-code="${code}">${I.pen} Publish revision ${draft.revision}</button>`);
  const diff = draft ? diffTpl(cur || {stages:[]}, draft) : [];
  return `<div class="page-h"><div><h1>${esc(show.name)}</h1><p>${code} · viewing rev ${show.revision} (${show.status.replace("_"," ")}) · effective ${show.effective||"on publish"}</p></div><div class="acts">${acts.join("")}</div></div>
  <div class="tabs">${revs.map(r=>`<button class="${r.revision===show.revision?"on":""}" data-act="tpl-rev" data-code="${code}" data-rev="${r.revision}">Rev ${r.revision} · ${r.status.replace("_"," ")}</button>`).join("")}</div>
  ${draft && diff.length ? `<div class="banner warn"><div><b>Changes in rev ${draft.revision}:</b> ${diff.slice(0,6).map(esc).join("; ")}${diff.length>6?` and ${diff.length-6} more`:""}</div></div>`:""}
  ${editable?`<div class="banner inf">Editing draft rev ${show.revision}. Changes don't affect any inspection until Quality publishes this revision.</div>`:""}
  <div class="panel"><div class="bd row" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><div><b>Variants</b> <span class="muted small">(${esc(show.variant_field||"Machine type")} — chosen by the inspector at start)</span><div style="margin-top:6px">${(show.machine_types||[]).map(v=>`<span class="pill info" style="margin-right:6px">${esc(v)}</span>`).join("")}</div></div>
    ${editable?`<div class="row"><input class="inp" id="tv-in" value="${esc((show.machine_types||[]).join(", "))}" style="min-width:280px"><button class="btn sm" data-act="tpl-variants" data-code="${code}">Save variants</button><button class="btn sm pri" data-act="tpl-stage" data-code="${code}">${I.plus} Add stage</button></div>`:`<span class="muted small">${allParams(show).filter(p=>p.applies?.length).length} variant-specific checks</span>`}</div></div>
  ${show.stages.map(st=>`<div class="panel sec"><h4>${esc(st.name)} <span class="muted small">(${st.code})</span></h4><div class="scroll-x"><table class="tbl"><thead><tr><th>Ref</th><th>Section</th><th>Parameter</th><th>Type</th><th>Spec</th><th>Min</th><th>Max</th><th>Unit</th><th>Critical</th><th>Evidence</th><th>Mandatory</th><th>Applies to</th>${editable?"<th></th>":""}</tr></thead><tbody>
    ${st.sections.flatMap(sec=>sec.params.map(p=>`<tr><td class="muted">${p.id}</td><td class="small">${esc(sec.name)}</td>
      <td>${editable?`<input class="inp" data-act="tpl-f" data-pid="${p.id}" data-f="label" value="${esc(p.label)}" style="min-width:220px">`:esc(p.label)}${p.tbc?` <span class="tag tbc">Spec TBC</span>`:""}</td>
      <td class="small">${p.type}</td><td class="small">${esc(Engine.spec(p))}</td>
      <td>${p.type==="range"?(editable?`<input class="inp" style="width:84px" data-act="tpl-f" data-pid="${p.id}" data-f="min" value="${p.min}">`:p.min):""}</td>
      <td>${p.type==="range"?(editable?`<input class="inp" style="width:84px" data-act="tpl-f" data-pid="${p.id}" data-f="max" value="${p.max}">`:p.max):""}</td>
      <td class="small">${esc(p.unit||"")}</td>
      <td>${editable?`<input type="checkbox" data-act="tpl-b" data-pid="${p.id}" data-f="critical" ${p.critical?"checked":""}>`:(p.critical?"Yes":"")}</td>
      <td>${editable?`<input type="checkbox" data-act="tpl-b" data-pid="${p.id}" data-f="evidence" ${p.evidence?"checked":""}>`:(p.evidence?"Yes":"")}</td>
      <td>${editable?`<input type="checkbox" data-act="tpl-b" data-pid="${p.id}" data-f="mandatory" ${p.mandatory?"checked":""}>`:(p.mandatory?"Yes":"")}</td>
      <td class="small">${p.applies?.length?p.applies.map(esc).join(", "):`<span class="muted">All</span>`}</td>
      ${editable?`<td><button class="btn sm" data-act="tpl-param" data-code="${code}" data-stage="${st.code}" data-sec="${esc(sec.name)}" data-pid="${p.id}">Edit</button></td>`:""}</tr>`)).join("")}
    </tbody></table></div>${editable?`<div style="padding:10px 14px">${st.sections.map(sec=>`<button class="btn sm" data-act="tpl-param" data-code="${code}" data-stage="${st.code}" data-sec="${esc(sec.name)}">${I.plus} Add check to “${esc(sec.name)}”</button> `).join("")}<button class="btn sm" data-act="tpl-section" data-code="${code}" data-stage="${st.code}">${I.plus} New section</button></div>`:""}</div>`).join("")}
  ${!show.stages.length?`<div class="panel"><div class="empty">No stages yet. ${editable?"Use <b>Add stage</b> to start building this machine's checklist.":""}</div></div>`:""}
  <div class="panel"><header><h3>Revision history</h3></header><div class="scroll-x"><table class="tbl"><tbody>${revs.flatMap(r=>(r.history||[]).map(h=>`<tr><td>Rev ${h.rev}</td><td>${fmtD(h.at)}</td><td>${esc(h.by)}</td><td>${esc(h.note)}</td></tr>`)).join("")}</tbody></table></div></div>`;
}
function diffTpl(a, b){
  const A = Object.fromEntries(allParams(a).map(p=>[p.id,p])), out=[];
  for (const p of allParams(b)){ const o = A[p.id]; if (!o){ out.push(`added ${p.id}`); continue; }
    for (const k of ["label","min","max","expected","critical","evidence","mandatory","applies"]) if (String(o[k]??"")!==String(p[k]??"")) out.push(`${p.id} ${k}: ${o[k]??"—"} → ${p[k]??"—"}`); }
  const B = new Set(allParams(b).map(p=>p.id)); for (const id in A) if (!B.has(id)) out.push(`removed ${id}`);
  if (String(a.machine_types||"")!==String(b.machine_types||"")) out.push(`variants: ${(a.machine_types||[]).join("/")||"—"} → ${(b.machine_types||[]).join("/")}`);
  return out;
}

  modal(`<header><h3>Add machine</h3><button class="x" data-act="close">×</button></header><div class="bd">
    <div class="grid g2" style="gap:0 12px">
      <div class="field"><label>Template code</label><input class="inp" id="nm-code" placeholder="APRON-3S" style="text-transform:uppercase"></div>
      <div class="field"><label>Product family</label><select class="sel" id="nm-fam">${fams.map(f=>`<option value="${f.code}">${esc(f.name)}</option>`).join("")}<option value="OTHER">Other / new family</option></select></div>
      <div class="field" style="grid-column:1/-1"><label>Machine name</label><input class="inp" id="nm-name" placeholder="Apron Band Dryer — 3 stage"></div>
      <div class="field" style="grid-column:1/-1"><label>Variants (comma separated; leave blank if only one build)</label><input class="inp" id="nm-var" placeholder="Steam, Thermic fluid, Direct fired"></div></div>
    <div class="field"><label>Start from</label>
      <label class="chk small"><input type="radio" name="nm-src" value="blueprint" checked> Family stage blueprint (empty stages, Engineering adds checks)</label>
      <label class="chk small"><input type="radio" name="nm-src" value="clone"> Copy a similar machine: <select class="sel" id="nm-clone" style="max-width:220px">${pubs.map(c=>`<option>${c}</option>`).join("")}</select></label>
      <label class="chk small"><input type="radio" name="nm-src" value="import"> Import Engineering checklist (Excel / JSON) — <span class="muted">production only</span></label></div>
    <div class="small muted">Creates draft rev A for Engineering. Nothing is usable on the floor until the Quality Manager publishes it.</div>
  </div><footer><button class="btn" data-act="close">Cancel</button><button class="btn pri" id="nm-ok">Create draft</button></footer>`);
  $("#nm-ok").onclick = () => {
    const code = $("#nm-code").value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,""), name = $("#nm-name").value.trim();
    if (code.length<3 || name.length<4) return toast("Enter a code and a name.", "bad");
    if (S.templates.some(t=>t.code===code)) return toast("That template code already exists.", "bad");
    const src = document.querySelector('input[name="nm-src"]:checked').value;
    if (src==="import") return toast("Import runs in production (XLSX parser + mapping screen). Use blueprint or copy in the prototype.", "");
    const vars = $("#nm-var").value.split(",").map(x=>x.trim()).filter(Boolean); const fam = $("#nm-fam").value;
    let stages = [];
    if (src==="clone"){ const base = latestTpl($("#nm-clone").value); stages = JSON.parse(JSON.stringify(base.stages)); allParams({stages}).forEach(p=>{ delete p.applies; }); }
    else { const f = (SEED.families?.families||[]).find(x=>x.code===fam); stages = (f?.stages||["COMP","ASSY","ELEC","FIN"]).map(c=>({code:c, name:(STAGE_LIB()[c]||c).split(" (")[0], sections:[{name:"General", params:[]}]})); }
    const t = {code, name, family:fam, revision:"A", status:"draft", effective:null, header_fields:["Customer","Sales order","Work order","Machine serial no.","Machine type","Despatch date"],
      machine_types: vars.length?vars:["Standard"], variant_field:"Machine type", stages, history:[{rev:"A", by:me().name, at:Date.now(), note:src==="clone"?`Created as copy of ${$("#nm-clone").value}`:"Created from family blueprint"}]};
    S.templates.push(t); tplEdit={code, rev:"A"}; audit("created machine template", code, `${name} · ${src}`); save(); closeModal(); go("template/"+code); toast(`${code} draft created. Add checks, then send for Quality approval.`, "ok");
  };
}
function draftOf(code){ return S.templates.find(t=>t.code===code && t.status==="draft"); }
function paramModal(code, stageCode, secName, pid){
  const d = draftOf(code); const st = d.stages.find(x=>x.code===stageCode); const sec = st.sections.find(x=>x.name===secName);
  const p = pid ? sec.params.find(x=>x.id===pid) : {type:"range", mandatory:true, critical:false, evidence:false};
  const vars = d.machine_types||[];
  modal(`<header><h3>${pid?"Edit check "+pid:"Add check"} — ${esc(st.name)} / ${esc(secName)}</h3><button class="x" data-act="close">×</button></header><div class="bd">
    <div class="field"><label>Check / parameter</label><input class="inp" id="pm-l" value="${esc(p.label||"")}"></div>
    <div class="grid g2" style="gap:0 12px">
      <div class="field"><label>Type</label><select class="sel" id="pm-t">${[["range","Measured value (min–max)"],["qty","Quantity"],["exact","Exact value / make"],["pass_fail","Pass / Fail"],["yes_no","Yes / No"],["text","Record only"]].map(([k,l])=>`<option value="${k}" ${p.type===k?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label>Unit</label><input class="inp" id="pm-u" value="${esc(p.unit||"")}"></div>
      <div class="field"><label>Min (range) / expected (qty, exact)</label><input class="inp" id="pm-min" value="${esc(p.type==="range"?p.min??"":p.expected??"")}"></div>
      <div class="field"><label>Max (range)</label><input class="inp" id="pm-max" value="${esc(p.max??"")}"></div></div>
    <div class="row" style="gap:18px;margin-bottom:12px"><label class="chk small"><input type="checkbox" id="pm-m" ${p.mandatory?"checked":""}> Mandatory</label><label class="chk small"><input type="checkbox" id="pm-c" ${p.critical?"checked":""}> Critical</label><label class="chk small"><input type="checkbox" id="pm-e" ${p.evidence?"checked":""}> Evidence</label><label class="chk small"><input type="checkbox" id="pm-tbc" ${p.tbc?"checked":""}> Spec TBC</label></div>
    <div class="field"><label>Applies to variants <span class="muted">(none ticked = all variants)</span></label><div class="row" style="gap:14px;flex-wrap:wrap">${vars.map(v=>`<label class="chk small"><input type="checkbox" class="pm-v" value="${esc(v)}" ${p.applies?.includes(v)?"checked":""}> ${esc(v)}</label>`).join("")}</div></div>
  </div><footer>${pid?`<button class="btn danger" id="pm-del">Remove</button>`:""}<button class="btn" data-act="close">Cancel</button><button class="btn pri" id="pm-ok">${pid?"Save":"Add check"}</button></footer>`);
  if (pid) $("#pm-del").onclick = () => { sec.params = sec.params.filter(x=>x.id!==pid); audit("removed check", `${code} rev ${d.revision}`, pid); save(); closeModal(); renderView(); };
  $("#pm-ok").onclick = () => {
    const ty=$("#pm-t").value, l=$("#pm-l").value.trim(), a=$("#pm-min").value.trim(), b=$("#pm-max").value.trim();
    if (l.length<3) return toast("Enter the check name.", "bad");
    if (ty==="range" && (isNaN(parseFloat(a))||isNaN(parseFloat(b))||parseFloat(a)>parseFloat(b))) return toast("Enter a valid min and max.", "bad");
    if ((ty==="qty"||ty==="exact") && !a) return toast("Enter the expected value.", "bad");
    const n = pid ? p : {id: stageCode+"-"+String(allParams(d).filter(x=>x.id.startsWith(stageCode+"-")).length+1).padStart(3,"0")};
    while (!pid && allParams(d).some(x=>x.id===n.id)) n.id = stageCode+"-"+String(parseInt(n.id.split("-").pop())+1).padStart(3,"0");
    Object.assign(n, {label:l, type:ty, unit:$("#pm-u").value.trim(), mandatory:$("#pm-m").checked, critical:$("#pm-c").checked, evidence:$("#pm-e").checked, tbc:$("#pm-tbc").checked});
    delete n.min; delete n.max; delete n.expected; delete n.options; delete n.accept;
    if (ty==="range"){ n.min=parseFloat(a); n.max=parseFloat(b); } if (ty==="qty") n.expected=parseFloat(a); if (ty==="exact") n.expected=a; if (ty==="yes_no") n.expected="Yes";
    const av=[...document.querySelectorAll(".pm-v:checked")].map(x=>x.value); if (av.length && av.length<vars.length) n.applies=av; else delete n.applies;
    if (!pid) sec.params.push(n);
    audit(pid?"edited check":"added check", `${code} rev ${d.revision}`, `${n.id} ${l}`); save(); closeModal(); renderView(); toast(pid?"Saved.":`${n.id} added.`, "ok");
  };
}

document.addEventListener("click", e => {
  const go_ = e.target.closest("[data-go]"); if (go_ && !e.target.closest("button[data-act],a,select,input")) { go(go_.dataset.go); return; }

  const act = a.dataset.act;
  if (a.tagName==="SELECT" || (a.tagName==="INPUT" && a.type!=="checkbox")) return;
  switch(act){
    case "login": doLogin(); break;
    case "login-fill": $("#li-u").value=a.dataset.u; $("#li-p").value="Tigl@2026"; $("#li-p").focus(); break;
    case "logout": audit("signed out", me()?.username||""); S.currentUser=null; save(); renderShell(); break;
    case "pw-change": { const p1=$("#cp-1").value, p2=$("#cp-2").value; const u=me();
      if (p1!==p2) return toast("Passwords don't match.", "bad"); if (!pwPolicyOk(p1)) return toast(`Use at least ${S.settings.auth.minLen} characters with upper, lower and a number.`, "bad");
      if (p1===u.password) return toast("Choose a password different from the temporary one.", "bad");
      u.password=p1; u.mustChange=false; u.pwChanged=Date.now(); audit("changed own password", u.username); save(); location.hash="#/dashboard"; renderShell(); toast("Password set. Welcome.", "ok"); break; }
    case "add-check": addCheckModal(curIns()); break;
    case "machine-new": newMachineModal(); break;
    case "tpl-param": paramModal(a.dataset.code, a.dataset.stage, a.dataset.sec, a.dataset.pid); break;
    case "tpl-variants": { const d=draftOf(a.dataset.code); const v=$("#tv-in").value.split(",").map(x=>x.trim()).filter(Boolean); if (!v.length) return toast("Enter at least one variant.", "bad");
      d.machine_types=v; allParams(d).forEach(p=>{ if (p.applies){ p.applies=p.applies.filter(x=>v.includes(x)); if (!p.applies.length) delete p.applies; } }); audit("changed variants", `${d.code} rev ${d.revision}`, v.join(", ")); save(); renderView(); toast("Variants saved.", "ok"); break; }
    case "tpl-stage": { const d=draftOf(a.dataset.code); const lib=STAGE_LIB(); const free=Object.keys(lib).filter(k=>!d.stages.some(s=>s.code===k));
      modal(`<header><h3>Add stage</h3><button class="x" data-act="close">×</button></header><div class="bd"><div class="field"><label>Stage</label><select class="sel" id="st-c">${free.map(k=>`<option value="${k}">${k} — ${esc(lib[k])}</option>`).join("")}<option value="_new">Custom stage…</option></select></div><div class="field"><label>Custom stage name (if custom)</label><input class="inp" id="st-n"></div></div><footer><button class="btn" data-act="close">Cancel</button><button class="btn pri" id="st-ok">Add stage</button></footer>`);
      $("#st-ok").onclick=()=>{ let c=$("#st-c").value, n; if (c==="_new"){ n=$("#st-n").value.trim(); if (n.length<3) return toast("Enter a stage name.", "bad"); c=n.replace(/[^A-Za-z]/g,"").slice(0,4).toUpperCase()||"CUST"; while(d.stages.some(s=>s.code===c)) c+="X"; } else n=lib[c].split(" (")[0];
        d.stages.push({code:c, name:n, sections:[{name:"General", params:[]}]}); audit("added stage", `${d.code} rev ${d.revision}`, c); save(); closeModal(); renderView(); }; break; }
    case "tpl-section": { const d=draftOf(a.dataset.code); const st=d.stages.find(x=>x.code===a.dataset.stage); const n=prompt("New section name in "+st.name); if (n && n.trim()){ if (st.sections.some(x=>x.name===n.trim())) return toast("Section exists.", "bad"); st.sections.push({name:n.trim(), params:[]}); save(); renderView(); } break; }
    case "user-reset": { const u=userById(a.dataset.id); const tp=tempPassword(); u.password=tp; u.mustChange=true; u.failed=0; u.lockedUntil=0; audit("reset password", u.username);
      save(); modal(`<header><h3>Temporary password for ${esc(u.username)}</h3><button class="x" data-act="close">×</button></header><div class="bd"><p>Give this to ${esc(u.name)} in person. It is shown once and must be changed at first sign-in.</p><pre class="code">${esc(tp)}</pre></div><footer><button class="btn pri" data-act="close">Done</button></footer>`); renderView(); break; }
    case "cert-upload": toast("Production: upload a PKCS#12 bundle; key is stored encrypted on the QC server and never displayed.", ""); break;
    case "cert-gen": { const e=entityOf(a.dataset.id); e.cert.fp=Array.from({length:8},()=>Math.floor(Math.random()*256).toString(16).padStart(2,"0").toUpperCase()).join(":"); e.cert.validTo="2028-12-31"; audit("re-issued signing certificate", e.id, e.cert.fp); save(); renderView(); toast("New certificate issued. Existing signed PDFs stay valid.", "ok"); break; } $("#app").classList.toggle("open"); break;
    case "close": closeModal(); break;
    case "reset": e.preventDefault(); if (confirm("Reset all demo data?")){ try{localStorage.removeItem(KEY);}catch(x){} _s=20261001; S=seedState(); save(); renderShell(); } break;
    case "notifs": {
      if ($(".notif-pop")) { $(".notif-pop").remove(); break; }
      const u=me(); const ns=S.notifications.filter(n=>n.roles.includes(u.role));
      const d=document.createElement("div"); d.className="notif-pop";
      d.innerHTML = ns.length ? ns.map(n=>`<div class="n">${n.read.includes(u.id)?"":"<b>•</b> "}${esc(n.text)}<div class="muted small">${fmtDT(n.at)} · also emailed via SMTP</div></div>`).join("") : `<div class="n muted">No notifications for your role yet.</div>`;
      $(".main").appendChild(d); ns.forEach(n=>{ if(!n.read.includes(u.id)) n.read.push(u.id); }); save(); $(".bell i")?.remove(); break; }

        a.disabled=false; a.textContent="Fetch from Odoo"; toast("Work order details pulled from Odoo.", "ok"); }, 700); break; }

    case "stage": curStage[route.arg] = a.dataset.id; renderView(); $("#view").scrollTop=0; break;
    case "setv": { setValue(route.arg, a.dataset.p, a.dataset.v); refreshRow(route.arg, a.dataset.p); break; }
    case "evidence": {
      const ins = curIns(); const pid=a.dataset.p;
      const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*,video/*,application/pdf"; inp.capture="environment";
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; const v = ins.values[pid] || {}; v.ev = [...(v.ev||[]), {name:f.name, size:(f.size/1048576).toFixed(1)+" MB"}]; ins.values[pid]=v; audit("attached evidence", ins.id, `${pid}: ${f.name}`); save(); refreshRow(ins.id, pid); toast("Evidence attached.", "ok"); };

      const ins = curIns(); const pid=a.dataset.p; const cur = ins.values[pid]?.remark||"";

      $("#rm-ok").onclick = () => { ins.values[pid] = {...(ins.values[pid]||{}), remark:$("#rm").value.trim()}; save(); closeModal(); refreshRow(ins.id, pid); }; break; }
    case "submit": case "review": case "approve": case "return": case "reject": transition(curIns(), act); break;

      const map = {checked:"submit", reviewed:"review", approved:"approve"}; transition(ins, map[slot]); break; }
    case "pdf": { const ins=curIns(); if (!sigsComplete(ins)) { toast("Sign all required fields to download.", "bad"); break; }
      audit("downloaded signed PDF", ins.id); save(); toast("Choose “Save as PDF” in the print dialog. Production generates the PDF server-side.", ""); setTimeout(()=>window.print(), 400); break; }
    case "ncr-close": { const n=S.ncrs.find(x=>x.id===a.dataset.id); if (!n.disposition) { toast("Choose a disposition before closing.", "bad"); break; } n.status="closed"; audit("closed NCR", n.id, n.disposition); save(); renderShell(); break; }
    case "tpl-rev": tplEdit = {code:a.dataset.code, rev:a.dataset.rev}; renderView(); break;
    case "tpl-draft": { const cur = latestTpl(a.dataset.code); const d = JSON.parse(JSON.stringify(cur)); d.revision = String.fromCharCode(cur.revision.charCodeAt(0)+1); d.status="draft"; d.effective=null;
      d.history = [{rev:d.revision, by:me().name, at:Date.now(), note:"Draft started"}]; S.templates.push(d); tplEdit={code:d.code, rev:d.revision}; audit("started template revision", `${d.code} rev ${d.revision}`); save(); renderView(); break; }

    case "tpl-submit": { const d=S.templates.find(t=>t.code===a.dataset.code && t.status==="draft"); d.status="in_review"; d.history.push({rev:d.revision, by:me().name, at:Date.now(), note:"Sent for Quality approval"}); notify(`${d.code} rev ${d.revision} awaiting your approval`, ["qm"]); audit("sent template for approval", `${d.code} rev ${d.revision}`); save(); renderShell(); toast("Sent to Quality Manager.", "ok"); break; }

      $("#pub-go").onclick = () => { if (!$("#pub-ok").checked) return toast("Tick the approval statement to publish.", "bad"); if (cur) cur.status="superseded"; d.status="published"; d.effective=new Date().toISOString().slice(0,10); d.history.push({rev:d.revision, by:me().name, at:Date.now(), note:`Published (${df.length} changes)`}); tplEdit=null; audit("published template", `${d.code} rev ${d.revision}`, `${df.length} changes`); notify(`${d.code} rev ${d.revision} published`, ["inspector","supervisor"]); save(); closeModal(); renderShell(); toast("Published.", "ok"); }; break; }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tigl_qc
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [tigl_postgres:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tigl_qc"], interval: 5s, timeout: 5s, retries: 20}
  migrate:
    build: {context: .., dockerfile: apps/api/Dockerfile}
    command: ["sh", "-c", "node database/migrate.mjs && node database/seed-axis.mjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/tigl_qc
    depends_on: {db: {condition: service_healthy}}
  bootstrap:
    build: {context: .., dockerfile: apps/api/Dockerfile}
    command: ["node", "database/bootstrap-admin.mjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/tigl_qc
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:?Set BOOTSTRAP_USERNAME in .env}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in .env}
      BOOTSTRAP_SITE_NAME: ${BOOTSTRAP_SITE_NAME:?Set BOOTSTRAP_SITE_NAME in .env}
    depends_on: {migrate: {condition: service_completed_successfully}}
  api:
    build: {context: .., dockerfile: apps/api/Dockerfile}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/tigl_qc
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:?Set AUDIT_HMAC_SECRET in .env}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?Set OTP_HMAC_SECRET in .env}
      OTP_ALLOWED_EMAIL_DOMAINS: ${OTP_ALLOWED_EMAIL_DOMAINS:?Set approved office email domains in .env}
      OTP_EMAIL_DELIVERY_URL: ${OTP_EMAIL_DELIVERY_URL:-}
      OTP_SMS_DELIVERY_URL: ${OTP_SMS_DELIVERY_URL:-}
      OTP_DELIVERY_TOKEN: ${OTP_DELIVERY_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      PORT: 3001
    depends_on: {bootstrap: {condition: service_completed_successfully}}
    healthcheck: {test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 3s, retries: 10}
  web:
    build: {context: .., dockerfile: apps/web/Dockerfile}
    environment: {API_INTERNAL_URL: http://api:3001}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: {api: {condition: service_healthy}}
  caddy:
    image: caddy:2-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [web, api]
  worker:
    build: {context: .., dockerfile: apps/worker/Dockerfile}
    depends_on: {api: {condition: service_healthy}}
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: [tigl_evidence:/data]
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes: [tigl_redis:/data]
  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=30s"]
volumes:
  tigl_postgres:
  tigl_evidence:
  tigl_redis:

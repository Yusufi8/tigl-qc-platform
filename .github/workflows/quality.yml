name: quality
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://qc:qc_test_password@localhost:5432/tigl_qc_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tigl_qc_test
          POSTGRES_USER: qc
          POSTGRES_PASSWORD: qc_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qc -d tigl_qc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply managed PostgreSQL 16 migrations and AXIS seed
        env:
          AUDIT_HMAC_SECRET: ci-only-test-key-please-use-a-random-production-key
          BOOTSTRAP_USERNAME: qc.admin
          BOOTSTRAP_PASSWORD: ci-only-password-longer-than-12
          BOOTSTRAP_SITE_NAME: CI Factory
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:bootstrap-admin
          npm run db:audit:verify
      - run: npm test
      - run: npm run typecheck
      - run: npm run build --workspace @tigl-qc/web
